# Generate the Xcode project with XcodeGen: brew install xcodegen && xcodegen
# Before a TestFlight upload, set DEVELOPMENT_TEAM and a bundle id you own.
name: Yapper
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium
    from: 0.11.0
  Opus:
    url: https://github.com/alta/swift-opus
    revision: 6f3cb6bd3ffed1fe5f06d00a962d5c191a50daf8
targets:
  Yapper:
    type: application
    platform: iOS
    sources: [Yapper]
    dependencies:
      - package: Sodium
        product: Clibsodium
      - package: Opus
        product: Copus
    info:
      path: Yapper/Info.plist
      properties:
        CFBundleDisplayName: Yapper
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Yapper sends your voice to the people in your channel.
        NSLocalNetworkUsageDescription: Yapper connects to voice servers on your local network.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.yapper
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
