<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0b0c0e" />
    <meta name="description" content="Your fragrance collection, and what to wear for today's weather." />
    <title>Sillage</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <a class="skip-link" href="#collection">Skip to collection</a>

    <header class="container topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="3.5" rx="1" /><path d="M10.5 5.5V8M13.5 5.5V8" /><rect x="5" y="8" width="14" height="14" rx="3.5" /><path d="M9 14.5h6" /></svg>
        </span>
        <div>
          <h1 class="brand-name">Sillage</h1>
          <p class="brand-sub" id="today-label">&nbsp;</p>
        </div>
      </div>

      <div class="controls">
        <fieldset class="segmented" id="tod">
          <legend class="sr-only">Time of day</legend>
          <label id="tod-auto"><input type="radio" name="tod" value="auto" checked /><span>Auto</span></label>
          <label><input type="radio" name="tod" value="day" /><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" /></svg>Day</span></label>
          <label><input type="radio" name="tod" value="night" /><span><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" /></svg>Night</span></label>
        </fieldset>
        <label class="select">
          <span class="sr-only">Occasion</span>
          <select id="occasion">
            <option value="">Any occasion</option>
            <option value="office">Office</option>
            <option value="casual">Casual</option>
            <option value="date">Date</option>
            <option value="evening">Evening</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="card weather" id="weather" aria-label="Current weather" aria-live="polite"></section>
      </div>

      <section class="container section" id="hero" aria-labelledby="hero-title"></section>

      <section class="container section" id="collection" aria-labelledby="collection-title" tabindex="-1">
        <div class="section-head toolbar">
          <div class="toolbar-title">
            <h2 id="collection-title">Collection</h2>
            <span class="count tabular" id="collection-count" aria-live="polite"></span>
          </div>
          <div class="toolbar-controls">
            <label class="search">
              <span class="sr-only">Search perfumes</span>
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg>
              <input class="input" id="search" type="search" placeholder="Search" autocomplete="off" spellcheck="false" />
              <kbd aria-hidden="true">/</kbd>
            </label>
            <label class="select">
              <span class="sr-only">Sort by</span>
              <select id="sort">
                <option value="score">Best match</option>
                <option value="name">Name</option>
                <option value="brand">Brand</option>
              </select>
            </label>
            <button class="btn btn--primary" type="button" data-action="add" data-focus-key="add-toolbar">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14M12 5v14" /></svg>Add perfume
            </button>
          </div>
        </div>
        <div id="grid"></div>
      </section>
    </main>

    <dialog class="dialog" id="perfume-dialog" aria-labelledby="dialog-title"></dialog>
    <div class="toasts" id="toasts" role="status" aria-live="polite"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
